[package]
name = "pain"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "A minimal Windows/Linux terminal built on libghostty-vt and Silvestris"
publish = false

[workspace]
resolver = "2"
members = ["crates/ghostty-vt-sys"]

[dependencies]
ghostty-vt-sys = { path = "crates/ghostty-vt-sys" }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
# Only used on MSVC hosts to locate the Windows SDK's rc.exe for the icon.
embed-resource = "3"

# M3 ConPTY transport. Narrow Win32 features only; no WinUI, no private DLL.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

# M4 POSIX PTY transport. Only libc primitives; no GTK/X11/Wayland code.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Pinned to a pushed Silvestris revision so a fresh clone builds without a
# sibling checkout, matching Chaus. This revision's config/pins.toml carries
# the same GPUI commit declared below. Bump both pins together.
[dependencies.silvestris]
git = "https://github.com/estyseesghosts/silvestris"
rev = "f1c2a010c1c84a90c9ad938eb307f5f2ef5a5ba7"
optional = true

# Must match the pinned Silvestris config/pins.toml exactly. Never upgrade this
# independently: two GPUI revisions produce incompatible types.
[dependencies.gpui]
git = "https://github.com/zed-industries/zed"
rev = "6b720973027999bae402df23d469026f4cced988"
default-features = false
optional = true

[dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
rev = "6b720973027999bae402df23d469026f4cced988"
default-features = false
optional = true

[target.'cfg(target_os = "linux")'.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
rev = "6b720973027999bae402df23d469026f4cced988"
default-features = false
features = ["wayland", "x11"]
optional = true

# Capacity-one wakeup bridge from the synthetic producer to GPUI's foreground
# executor. Already in Cargo.lock through GPUI; no second executor is added.
[dependencies.async-channel]
version = "2"
optional = true

[features]
default = []
# Enable only with the M1 window renderer; pulls in Silvestris and its GPUI.
shell = ["dep:silvestris", "dep:gpui", "dep:gpui_platform", "dep:async-channel"]

[profile.dev]
debug = "line-tables-only"
