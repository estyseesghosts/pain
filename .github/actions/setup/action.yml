name: Set up pain build tools
description: Install Rust, Zig and platform libraries shared by pain CI and release jobs
inputs:
  zig-version:
    description: Zig version used by the pinned libghostty-vt build
    required: false
    default: '0.17.1'
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
        rustup default 1.98.1

    - name: Install Linux libraries and Zig
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config cmake clang lld llvm curl xz-utils \
          libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
          libva-dev libvulkan1 libwayland-dev libx11-xcb-dev \
          libxkbcommon-x11-dev libzstd-dev
        curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" \
          "https://ziglang.org/download/${{ inputs.zig-version }}/zig-x86_64-linux-${{ inputs.zig-version }}.tar.xz"
        tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
        zig_dir="$RUNNER_TEMP/zig-x86_64-linux-${{ inputs.zig-version }}"
        echo "ZIG=$zig_dir/zig" >> "$GITHUB_ENV"
        echo "$zig_dir" >> "$GITHUB_PATH"

    # GitHub's Windows runner uses the MSVC host. That is the ABI GPUI's
    # windows-manifest resource import library is built for, so stay on the
    # default target. build.rs resolves rc.exe from the Windows SDK for the
    # application icon, the same way Chaus does.
    - name: Install Zig on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = '${{ inputs.zig-version }}'
        $archive = Join-Path $env:RUNNER_TEMP 'zig-windows.zip'
        Invoke-WebRequest -Uri "https://ziglang.org/download/$version/zig-x86_64-windows-$version.zip" -OutFile $archive
        Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
        $zigDir = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$version"
        "ZIG=$(Join-Path $zigDir 'zig.exe')" >> $env:GITHUB_ENV
        $zigDir >> $env:GITHUB_PATH
