name: Set up pain build tools
description: Install Rust, Zig and platform libraries shared by pain CI and release jobs
inputs:
  zig-version:
    description: Zig version used by the pinned libghostty-vt build
    required: false
    default: '0.17.1'
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
        rustup default 1.98.1

    - name: Install Linux libraries and Zig
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config cmake clang lld llvm curl xz-utils \
          libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
          libva-dev libvulkan1 libwayland-dev libx11-xcb-dev \
          libxkbcommon-x11-dev libzstd-dev
        curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" \
          "https://ziglang.org/download/${{ inputs.zig-version }}/zig-linux-x86_64-${{ inputs.zig-version }}.tar.xz"
        tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
        zig_dir="$RUNNER_TEMP/zig-linux-x86_64-${{ inputs.zig-version }}"
        echo "ZIG=$zig_dir/zig" >> "$GITHUB_ENV"
        echo "$zig_dir" >> "$GITHUB_PATH"

    - name: Install MSYS2 MinGW toolchain
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

    - name: Install Zig and configure the GNU target on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = '${{ inputs.zig-version }}'
        $archive = Join-Path $env:RUNNER_TEMP 'zig-windows.zip'
        Invoke-WebRequest -Uri "https://ziglang.org/download/$version/zig-windows-x86_64-$version.zip" -OutFile $archive
        Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
        $zigDir = Join-Path $env:RUNNER_TEMP "zig-windows-x86_64-$version"
        "ZIG=$(Join-Path $zigDir 'zig.exe')" >> $env:GITHUB_ENV
        $zigDir >> $env:GITHUB_PATH

        # Pain's Windows release target is the GNU host; build.rs compiles the
        # icon with windres and links the Zig-built static library.
        $shim = Join-Path $env:RUNNER_TEMP 'pain-windres'
        New-Item -ItemType Directory -Force $shim | Out-Null
        @'
        @echo off
        "C:\msys64\mingw64\bin\x86_64-w64-mingw32-windres.exe" %*
        '@ | Set-Content -LiteralPath (Join-Path $shim 'windres.cmd')
        "$shim;C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
        "CC_x86_64_pc_windows_gnu=C:\msys64\mingw64\bin\gcc.exe" >> $env:GITHUB_ENV
        "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" >> $env:GITHUB_ENV
        rustup target add x86_64-pc-windows-gnu
