name: Release

# Publishing runs from an annotated tag named vYY-MM-xxxxxxx. verify.yml
# ignores tags, so this workflow reruns the same gate before publishing.
on:
  push:
    tags:
      - 'v[0-9][0-9]-[0-9][0-9]-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vYY-MM-xxxxxxx tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: target/release/pain
            asset: pain-linux-x64
          - os: windows-latest
            binary: target/x86_64-pc-windows-gnu/release/pain.exe
            asset: pain-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --features shell --locked

      - name: Stage the artifact outside the checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "${{ matrix.binary }}" "$RUNNER_TEMP/release/${{ matrix.asset }}"
          cd "$RUNNER_TEMP/release"
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Smoke test the staged binary
        shell: bash
        working-directory: ${{ runner.temp }}/release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ./"${{ matrix.asset }}" --version
          ./"${{ matrix.asset }}" --help > /dev/null
          ./"${{ matrix.asset }}" --version | grep -F "pain $TAG "

      - name: Report Linux dynamic dependencies
        if: runner.os == 'Linux'
        run: ldd "$RUNNER_TEMP/release/${{ matrix.asset }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify checksums before publishing
        working-directory: release-assets
        run: |
          for file in *.sha256; do sha256sum --check "$file"; done
          ls -l

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
